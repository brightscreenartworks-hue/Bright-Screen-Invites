  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --pink: #E31C6E;
      --pink-dark: #B8144F;
      --pink-soft: rgba(227, 28, 110, 0.08);
      --pink-border: rgba(227, 28, 110, 0.22);
      --cream: #FFF8F5;
      --cream-card: #FFFFFF;
      --ink: #241016;
      --muted: #8a7580;
      --muted-light: #b39aa3;
      --border: rgba(36, 16, 22, 0.09);
      --gold: #D4AF37;
      --shadow-sm: 0 2px 8px rgba(36, 16, 22, 0.06);
      --shadow-md: 0 8px 24px rgba(36, 16, 22, 0.08);
      --shadow-lg: 0 16px 36px rgba(227, 28, 110, 0.14);
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    img,
    svg {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--serif);
      font-weight: 600;
      line-height: 1.25;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    /* Header */
    header {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 50;
      background: var(--cream);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      max-width: 1180px;
      margin: 0 auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-logo-img {
      height: 44px;
      width: auto;
      max-width: 220px;
      object-fit: contain;
      display: block;
      transition: transform .2s ease;
    }

    .brand-logo-img:hover {
      transform: scale(1.02);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-link {
      font-size: .88rem;
      font-weight: 500;
      color: var(--ink);
      opacity: .8;
      transition: opacity .2s ease, color .2s ease;
    }

    .nav-link:hover {
      opacity: 1;
      color: var(--pink);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-main-site {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      color: var(--pink);
      border: 1.5px solid var(--pink);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: .84rem;
      font-weight: 600;
      transition: all .2s ease;
    }

    .btn-main-site:hover {
      background: var(--pink);
      color: #fff;
    }

    .btn-book {
      display: inline-flex;
      align-items: center;
      background: var(--pink);
      color: #fff;
      padding: 9px 20px;
      border-radius: 999px;
      font-size: .84rem;
      font-weight: 600;
      transition: all .2s ease;
      box-shadow: 0 2px 10px rgba(227, 28, 110, 0.28);
    }

    .btn-book:hover {
      background: var(--pink-dark);
      transform: translateY(-1px);
    }

    html, body {
      overflow-x: hidden;
      max-width: 100vw;
    }

    @media (max-width: 768px) {
      .wrap {
        padding: 0 16px;
      }
      .nav {
        padding: 10px 16px;
      }
      .nav-links {
        display: none;
      }
      .brand-logo-img {
        height: 34px;
        max-width: 150px;
      }
      .nav-actions {
        gap: 6px;
      }
      .btn-main-site {
        padding: 6px 12px;
        font-size: .76rem;
      }
      .btn-book {
        padding: 7px 14px;
        font-size: .76rem;
      }
      .hero-sec {
        padding: 20px 0 16px;
      }
      .hero-sec h1 {
        font-size: clamp(1.4rem, 5.5vw, 2.2rem);
        margin-bottom: 6px;
      }
      .hero-sec p {
        font-size: 0.88rem;
        line-height: 1.45;
      }
      .breadcrumb {
        font-size: 0.78rem;
        margin-bottom: 8px;
        gap: 6px;
      }
      .showcase-header {
        margin-bottom: 16px;
        gap: 10px;
      }
      .showcase-header h2 {
        font-size: 1.35rem;
      }
      .back-btn {
        padding: 6px 12px;
        font-size: .76rem;
      }
      main {
        padding: 20px 0 44px;
      }
      .card-body {
        padding: 13px;
        gap: 8px;
      }
      .thumb-content {
        padding: 10px;
      }
      .thumb-title {
        font-size: 1.02rem;
      }
      .btn-fill-details,
      .action-wa-btn,
      .action-share-btn {
        font-size: 0.76rem;
        padding: 8px 6px;
      }
      .btn-fill-details svg,
      .action-wa-btn svg,
      .action-share-btn svg {
        width: 13px;
        height: 13px;
      }
      footer {
        padding: 28px 0 20px;
      }
      .foot-bottom {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }

    @media (max-width: 380px) {
      .wrap {
        padding: 0 12px;
      }
      .brand-logo-img {
        height: 28px;
        max-width: 120px;
      }
      .btn-main-site {
        padding: 5px 8px;
        font-size: .7rem;
      }
      .btn-book {
        padding: 6px 10px;
        font-size: .7rem;
      }
      .card-actions-row {
        flex-direction: column;
        gap: 6px;
      }
      .btn-fill-details,
      .action-wa-btn,
      .action-share-btn {
        width: 100%;
        padding: 8px 10px;
      }
    }

    /* Hero / Header Section */
    .hero-sec {
      padding: 32px 0 24px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, var(--cream) 0%, #fffbf8 100%);
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .84rem;
      color: var(--muted);
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .breadcrumb a:hover {
      color: var(--pink);
    }

    .hero-sec h1 {
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      margin-bottom: 8px;
      color: var(--ink);
    }

    .hero-sec p {
      color: var(--muted);
      font-size: 0.96rem;
      max-width: 720px;
      line-height: 1.5;
    }

    /* Main Container */
    main {
      flex: 1;
      padding: 32px 0 60px;
    }

    /* Views System */
    .view-panel {
      display: none;
      animation: fadeIn .3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .view-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive Category Gig Cards Grid (4 in 1 row on Desktop, 2 in 1 row on Mobile) */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 14px;
    }

    @media (max-width: 991px) and (min-width: 600px) {
      .category-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
    }

    @media (max-width: 599px) {
      .category-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 10px;
      }
    }

    /* Showcase & Sample Grids */
    .showcase-grid-two-col,
    .samples-grid,
    .rec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      gap: 22px;
      margin-top: 14px;
    }

    @media (max-width: 680px) {
      .showcase-grid-two-col,
      .samples-grid,
      .rec-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* Reduced Size Category Gig Card */
    .gig-card {
      background: var(--cream-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-sm);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
      cursor: pointer;
      width: 100%;
    }

    .gig-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--pink);
    }

    .gig-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 11;
      background: #180612;
      overflow: hidden;
    }

    .gig-thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.04);
      transform-origin: center center;
      transition: transform .35s ease;
    }

    .gig-card:hover .gig-thumb-img {
      transform: scale(1.10);
    }

    .gig-card-body {
      padding: 10px 8px;
      text-align: center;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }

    .gig-category-name {
      font-family: var(--serif);
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink);
      margin: 0;
      line-height: 1.25;
      transition: color .2s ease;
    }

    .gig-card:hover .gig-category-name {
      color: var(--pink);
    }

    .gig-badge-count {
      display: inline-block;
      font-size: 0.68rem;
      color: var(--pink);
      font-weight: 600;
      margin-top: 3px;
      background: var(--pink-soft);
      padding: 2px 7px;
      border-radius: 999px;
    }

    @media (max-width: 599px) {
      .gig-card {
        border-radius: 10px;
      }
      .gig-card-body {
        padding: 8px 6px;
      }
      .gig-category-name {
        font-size: 0.8rem;
        line-height: 1.2;
      }
      .gig-badge-count {
        font-size: 0.62rem;
        padding: 1px 5px;
        margin-top: 2px;
      }
    }

    /* Showcase Layout */
    .showcase-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 14px;
      padding-bottom: 12px;
      border-bottom: 1.5px solid var(--border);
    }

    .showcase-header h2 {
      font-size: 1.75rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--cream-card);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: .84rem;
      font-weight: 600;
      color: var(--ink);
      transition: all .2s ease;
      cursor: pointer;
    }

    .back-btn:hover {
      border-color: var(--pink);
      color: var(--pink);
      background: var(--pink-soft);
    }

    /* Sample Gig Card (Exact Parth & Nidhi Structure) */
    .card {
      background: var(--cream-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-md);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
    }

    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3.2;
      background: #14050D;
      overflow: hidden;
      cursor: pointer;
      display: block;
      text-decoration: none;
      border-radius: 12px 12px 0 0;
    }

    .thumb-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(2.2);
      transform-origin: center 45%;
      transition: transform .35s ease;
    }

    .thumb-img.thumb-wide {
      transform: scale(1.05);
      transform-origin: center center;
    }

    .thumb-wrap:hover .thumb-img {
      transform: scale(2.28);
    }

    .thumb-wrap:hover .thumb-img.thumb-wide {
      transform: scale(1.1);
    }

    .thumb-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.05) 0%, rgba(20, 5, 12, 0.88) 100%);
      pointer-events: none;
    }

    .thumb-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px;
      color: #fff;
      z-index: 2;
    }

    .thumb-title {
      font-family: var(--serif);
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .6);
    }

    .thumb-tags {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .thumb-tag {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(4px);
      font-size: .68rem;
      padding: 2px 7px;
      border-radius: 4px;
      color: #fff;
      letter-spacing: .03em;
    }

    .badge-video {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(227, 28, 110, 0.92);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      z-index: 3;
      letter-spacing: 0.02em;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: background .2s ease;
    }

    .badge-yt {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 0, 0, 0.92);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      z-index: 3;
      letter-spacing: 0.02em;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background .2s ease;
    }

    .badge-yt svg {
      width: 14px;
      height: 10px;
    }

    /* YouTube Centered Play Icon Overlay */
    .yt-play-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      width: 58px;
      height: 40px;
      background: rgba(255, 0, 0, 0.92);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      transition: all .25s ease;
      z-index: 2;
      pointer-events: none;
    }

    .yt-play-center svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
      margin-left: 2px;
    }

    .thumb-wrap:hover .yt-play-center {
      transform: translate(-50%, -50%) scale(1.08);
      background: #ff0000;
      box-shadow: 0 8px 26px rgba(255, 0, 0, 0.6);
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-meta {
      font-size: .78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-region-style {
      font-size: .8rem;
      color: var(--pink);
      font-weight: 600;
    }

    .card-desc {
      font-size: .84rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Horizontal Row: Fill Details & WhatsApp Share side-by-side */
    .card-actions-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      margin-top: auto;
      padding-top: 8px;
    }

    .btn-fill-details {
      flex: 1;
      min-width: 0;
      background: var(--pink);
      color: #fff;
      border: none;
      padding: 9px 10px;
      border-radius: 7px;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all .2s ease;
      box-shadow: 0 2px 8px rgba(227, 28, 110, .2);
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-fill-details:hover {
      background: var(--pink-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(227, 28, 110, .3);
      color: #fff;
    }

    .action-wa-btn,
    .action-share-btn {
      flex: 1;
      min-width: 0;
      background: #25D366;
      color: #fff;
      border: none;
      padding: 9px 10px;
      border-radius: 7px;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all .2s ease;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(37, 211, 102, .2);
      white-space: nowrap;
    }

    .action-wa-btn:hover,
    .action-share-btn:hover {
      background: #1EBE5D;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(37, 211, 102, .3);
      color: #fff;
    }

    /* Footer */
    footer {
      background: linear-gradient(180deg, var(--cream) 0%, #fff0f5 100%);
      color: var(--ink);
      border-top: 1px solid var(--border);
      padding: 40px 0 24px;
      font-size: .88rem;
      margin-top: auto;
    }

    .foot-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: .82rem;
      color: var(--muted);
    }
  
    /* Sample Gig Cards in Categories matching collection sizing */
    .sample-gig-card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sample-gig-card .gig-card-body {
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      flex: 1;
    }

    .sample-gig-card .gig-category-name {
      font-family: var(--serif);
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.25;
      margin: 0;
    }

    .sample-tag-line {
      font-size: 0.76rem;
      color: var(--pink);
      font-weight: 600;
      margin-top: 3px;
      margin-bottom: 6px;
      line-height: 1.3;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
      cursor: pointer;
      transition: color .2s ease, transform .2s ease;
    }

    .sample-tag-line:hover,
    .gig-card:hover .sample-tag-line {
      color: var(--gold);
      transform: translateY(-1px);
    }

    .badge-yt {
      display: none !important;
    }

    .sample-gig-card .card-actions-row {
      display: flex;
      flex-direction: row;
      align-items: center;

  <script>
    // Generic page for categories created in the Admin Panel.
    function showCategories() {
      window.location.hash = 'categories';
    }

    // Share functionality for sample gig cards
    function handleShare(btn, explicitTitle, explicitUrl) {
      const card = btn ? (btn.closest('.gig-card') || btn.closest('.card')) : null;
      const title = explicitTitle || (btn && btn.getAttribute('data-share-title')) || (card && card.querySelector('.gig-category-name, .thumb-title') ? card.querySelector('.gig-category-name, .thumb-title').textContent.trim() : '') || 'Bright Screen Invites';
      const url = explicitUrl || (btn && btn.getAttribute('data-share-url')) || (card && card.querySelector('a.gig-thumb-wrap, a.sample-tag-line') ? card.querySelector('a.gig-thumb-wrap, a.sample-tag-line').href : window.location.href);
      const text = `Check out this invite by Bright Screen Invites: ${title}`;

      if (navigator.share) {
        navigator.share({
          title: `${title} · Bright Screen Invites`,
          text: text,
          url: url
        }).catch(err => {
          if (err.name !== 'AbortError') {
            copyToClipboard(url, btn);
          }
        });
      } else {
        copyToClipboard(url, btn);
      }
    }

    function copyToClipboard(url, btn) {
      function showSuccess() {
        if (!btn) return;
        const origHtml = btn.innerHTML;
        btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!`;
        setTimeout(() => {
          btn.innerHTML = origHtml;
        }, 2000);
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(showSuccess).catch(() => {
          fallbackCopy(url, showSuccess);
        });
      } else {
        fallbackCopy(url, showSuccess);
      }
    }

    function fallbackCopy(text, cb) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        if (cb) cb();
      } catch (e) {
        prompt('Copy link:', text);
      }
      document.body.removeChild(ta);
    }

  </script>
